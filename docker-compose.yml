#version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: Onlinej
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vymu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Onlinej"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./core
    #working_dir: /app
    
    volumes:
      - ./core:/app
    command:  gunicorn core.wsgi:application --bind 0.0.0.0:8000
    environment:
      - DATABASE_URL=postgres://postgres:vymu@db:5432/Onlinej
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./OnlineJ
    ports:
      - "3000:80"

volumes:
  postgres_data:
